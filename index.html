<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fantasy Preview Shows</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0b0f17;color:#eef2f7;font-family:Barlow,system-ui,sans-serif}
header{padding:40px 20px 16px;text-align:center;background:radial-gradient(circle at 50% 0,#1d3a6b 0,#0b0f17 70%)}
h1{font-family:'Bebas Neue';font-size:56px;letter-spacing:2px;margin:0;color:#ffd34d}
p.sub{margin:6px 0 0;color:#9fb0c8}
main{max-width:900px;margin:0 auto;padding:20px}
h2{font-family:'Bebas Neue';font-size:30px;letter-spacing:1px;border-bottom:2px solid #ffd34d33;padding-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
a.card{display:block;background:#141b28;border-radius:14px;overflow:hidden;text-decoration:none;color:inherit;transition:transform .15s}
a.card:hover{transform:translateY(-3px)}
a.card img{width:100%;aspect-ratio:9/16;object-fit:cover;display:block}
a.card div{padding:10px 12px;font-weight:700}
</style></head><body>
<header><h1>Fantasy Preview Shows</h1><p class="sub">Weekly matchup previews and commercials</p></header>
<main id="m"></main>
<script>
fetch('shows.json').then(r=>r.json()).then(s=>{
  const by={};s.forEach(x=>(by[x.league]=by[x.league]||[]).push(x));
  const m=document.getElementById('m');
  for(const [lg,list] of Object.entries(by)){
    list.sort((a,b)=>b.week-a.week);
    const h=document.createElement('h2');h.textContent=lg;m.appendChild(h);
    const g=document.createElement('div');g.className='grid';
    list.forEach(x=>{const a=document.createElement('a');a.className='card';a.href=x.path;
      const i=document.createElement('img');i.src=x.path+'poster.jpg';i.alt='';
      const d=document.createElement('div');d.textContent='Week '+x.week;a.append(i,d);g.appendChild(a);});
    m.appendChild(g);
  }
});
</script></body></html>
